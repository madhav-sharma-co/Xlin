#
# Publishes a GitHub release for a pushed version tag. It builds nothing: it takes the release package
# that the "Kernel build" workflow already built, tested and verified for the SAME commit as the tag
# (artifact xlin-release-candidate), re-checks its checksum, and attaches it. The package is unsigned:
# the production signing key does not exist in CI; the maintainer signs SHA256SUMS separately.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'
      commit:
        description: 'Full commit SHA to release (its Kernel build run must be green)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find the successful Kernel build run for this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit || github.sha }}
        run: |
          set -eu
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kernel-build.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          [ -n "$id" ] || { echo "no successful 'Kernel build' run exists for $SHA; tag a commit whose CI is green" >&2; exit 1; }
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "Using Kernel build run $id"
      - uses: actions/download-artifact@v4
        with:
          name: xlin-release-candidate
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA: ${{ inputs.commit || github.sha }}
        run: |
          set -eu
          cd dist
          ls -l
          sha256sum -c ./*.tar.zst.sha256
          { cat ../docs/RELEASE-NOTES.md | sed '1,/^# /{/^# /!d}' ; echo; echo "Built by CI run ${{ steps.run.outputs.id }} for commit $SHA. The package is unsigned (no production key exists yet); verify it with the .sha256 file. Development kernel for QEMU + OVMF; not validated on physical hardware."; } >../notes.md
          gh release create "$TAG" --target "$SHA" --title "Xlin Kernel ${TAG#v}" --notes-file ../notes.md ./*.tar.zst ./*.tar.zst.sha256
