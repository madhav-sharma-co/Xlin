# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the REAL pinned kernel with the approved Xlin x86_64 configuration and checks
# the artifacts. A build validation only: the kernel is NOT booted here, and the
# uploaded files are build artifacts, not a release.
name: Kernel build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Debugging only: reuse the build artifact of this earlier run instead of rebuilding (the runtime-test job then runs; build and boot-test are skipped)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.build_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev zstd kmod file time
          gcc --version | head -n1; make --version | head -n1; nproc; free -g | sed -n 2p; df -h . | tail -n1

      - name: Static checks (syntax and shellcheck)
        run: |
          set -eu
          files="scripts/xlin-build tests/build-negative.sh"
          for f in $files; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $files

      - name: Xlin Fetch and Xlin Verify (pinned source, strict)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Build script negative tests
        run: ./tests/build-negative.sh

      - name: Xlin Build (configure, compile, install modules, check artifacts)
        run: |
          set -o pipefail
          ./scripts/xlin-build --out "$PWD/build/xlin-x86_64" 2>&1 | tee build-run.log

      - name: Build report
        if: always()
        run: |
          if [ -f build/xlin-x86_64/report/build-report.md ]; then
            cat build/xlin-x86_64/report/build-report.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No build report was produced (the build failed before it)." | tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 60 build-run.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: The pinned source is still unmodified
        run: ./scripts/xlin-verify --strict >/dev/null

      - name: Upload the build artifacts (not a release; not boot-tested)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlin-kernel-build
          path: |
            build/xlin-x86_64/report/
            build/xlin-x86_64/logs/
          if-no-files-found: warn
          retention-days: 14

  boot-test:
    # Boots the kernel built by the "build" job in QEMU with OVMF (UEFI) and a minimal
    # initramfs. Direct kernel boot: this does NOT test Xlin Boot, and QEMU success says
    # nothing about physical hardware.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF and BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static zstd file
          qemu-system-x86_64 --version | head -n1
          dpkg-query -W -f '${Package} ${Version}\n' ovmf qemu-system-x86 busybox-static
          busybox 2>&1 | head -n1
          ls -l /dev/kvm || echo "no /dev/kvm: the test will use software emulation (TCG)"

      - name: Allow QEMU to use KVM when the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Static checks (syntax and shellcheck)
        run: |
          set -eu
          files="scripts/xlin-initramfs tests/boot-selftest.sh tests/boot-negative.sh"
          for f in $files; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $files
          python3 -m py_compile scripts/xlin-boot-test
          for f in tests/boot/init tests/boot/xlin-pass tests/boot/init-broken; do sh -n "$f"; done

      - name: Xlin Fetch and Xlin Verify (pinned source, needed for gen_init_cpio)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Download the kernel built by the build job
        uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact

      - name: The kernel under test is the one the build job reported
        run: |
          set -eu
          ls -l artifact/report/
          want=$(sed -n 's/^bzimage_sha256=//p' artifact/report/build-report.env)
          got=$(sha256sum artifact/report/bzImage | cut -d' ' -f1)
          echo "build report: $want"; echo "downloaded:   $got"
          [ -n "$want" ] && [ "$want" = "$got" ]
          grep '^kernel_release=' artifact/report/build-report.env

      - name: Boot-tool self-test (simulated guest, not a boot)
        run: ./tests/boot-selftest.sh

      - name: Build the minimal initramfs
        run: ./scripts/xlin-initramfs --out build/boot-test/initramfs.cpio.zst

      - name: Boot the Xlin Kernel in QEMU + OVMF
        run: |
          set -o pipefail
          ./scripts/xlin-boot-test --kernel artifact/report/bzImage --initramfs build/boot-test/initramfs.cpio.zst \
            --out build/boot-test/run --timeout 600 2>&1 | tee boot-run.log

      - name: Boot report
        if: always()
        run: |
          if [ -f build/boot-test/run/report.md ]; then
            cat build/boot-test/run/report.md | tee -a "$GITHUB_STEP_SUMMARY"
            echo '### Serial log (complete)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 400 build/boot-test/run/serial.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No boot report was produced." | tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 40 boot-run.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Complete serial log of the boot test
        if: always()
        run: |
          echo "::group::serial.log"
          cat build/boot-test/run/serial.log || true
          echo "::endgroup::"
          cat build/boot-test/initramfs.cpio.zst.manifest || true

      - name: Boot negative tests (real boots that must fail)
        run: ./tests/boot-negative.sh --kernel artifact/report/bzImage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-boot-test
          path: |
            build/boot-test/run/serial.log
            build/boot-test/run/report.md
            build/boot-test/run/result.env
            build/boot-test/run/qemu-command.txt
            build/boot-test/run/qemu-stderr.log
            build/boot-test/initramfs.cpio.zst.manifest
          if-no-files-found: warn
          retention-days: 14

  runtime-test:
    # Step 6: expanded runtime validation (boot matrix, /proc/config.gz identity, hardening and
    # systemd probes, devices, filesystems, modules with kmod, kernel-log scan, reliability,
    # informational measurements). QEMU + OVMF only: this does NOT test Xlin Boot, physical
    # hardware or production readiness.
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF, BusyBox, kmod and the image tools (from the distribution; nothing is committed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static zstd file kmod \
            e2fsprogs dosfstools mtools squashfs-tools genisoimage btrfs-progs xfsprogs ntfs-3g exfatprogs
          {
            echo "### Tools used by the runtime test (installed on the runner, not committed)"
            echo '```'
            dpkg-query -W -f '${Package} ${Version}\n' qemu-system-x86 ovmf busybox-static kmod libkmod2 e2fsprogs dosfstools mtools squashfs-tools genisoimage btrfs-progs xfsprogs ntfs-3g
            echo '```'
            echo "kmod licence (from /usr/share/doc/kmod/copyright):"
            echo '```'
            grep -E '^(License|Files):' /usr/share/doc/kmod/copyright | head -n 12 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l /dev/kvm || echo "no /dev/kvm: runs will use software emulation (TCG)"

      - name: Allow QEMU to use KVM when the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Static checks (syntax, shellcheck, guest scripts)
        run: |
          set -eu
          host="scripts/xlin-test-images scripts/xlin-initramfs tests/runtime-selftest.sh"
          for f in $host; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $host
          python3 -m py_compile scripts/xlin-runtime-test scripts/xlin-probe-map scripts/xlin-runtime-compare scripts/xlin-wx-compare
          for f in tests/runtime/init tests/runtime/lib.sh tests/runtime/probes.sh tests/runtime/reboot-cycle tests/runtime/panic-cycle tests/runtime/udhcpc.script tests/runtime/suites/*.sh; do sh -n "$f"; done

      - name: Xlin Fetch and Xlin Verify (pinned source, needed for gen_init_cpio and Kconfig)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Download the kernel built by the build job
        uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: The kernel under test is the one the build job reported
        run: |
          set -eu
          want=$(sed -n 's/^bzimage_sha256=//p' artifact/report/build-report.env)
          got=$(sha256sum artifact/report/bzImage | cut -d' ' -f1)
          [ -n "$want" ] && [ "$want" = "$got" ]
          ls -l artifact/report/

      - name: Probe map (every probe against the build's real final .config)
        run: |
          set -o pipefail
          python3 scripts/xlin-probe-map --src upstream/src/linux --config artifact/report/config-final \
            --allow-unsupported --out probe-map.md | tee probe-map.txt
          { echo "### Probe-to-option map"; cat probe-map.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Runtime-tool self-test (simulated guest, not a boot)
        run: ./tests/runtime-selftest.sh

      - name: Build the runtime initramfs (with the runner's kmod) and the test disk images
        run: |
          set -eu
          ./scripts/xlin-initramfs --runtime --kmod /usr/bin/kmod --out build/runtime-test/initramfs.cpio.zst
          cat build/runtime-test/initramfs.cpio.zst.manifest
          ./scripts/xlin-test-images --out build/runtime-test/images --modules-tar artifact/report/modules-*.tar.zst

      - name: Runtime validation, all scenarios (one boot each)
        run: |
          set -o pipefail
          ./scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs build/runtime-test/initramfs.cpio.zst \
            --images build/runtime-test/images --config artifact/report/config-final \
            --scenarios all --repeat 1 --out build/runtime-test/run-all 2>&1 | tee runtime-all.log

      - name: Runtime validation, boot matrix (vCPUs x memory, 3 boots each, flake rate)
        if: ${{ !cancelled() && hashFiles('build/runtime-test/initramfs.cpio.zst') != '' }}
        run: |
          set -o pipefail
          ./scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs build/runtime-test/initramfs.cpio.zst \
            --images build/runtime-test/images --config artifact/report/config-final \
            --scenarios base --matrix auto --repeat 3 --out build/runtime-test/run-matrix 2>&1 | tee runtime-matrix.log

      - name: Runtime validation under software emulation (TCG), reduced matrix, 2 boots each
        if: ${{ !cancelled() && hashFiles('build/runtime-test/initramfs.cpio.zst') != '' }}
        run: |
          set -o pipefail
          ./scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs build/runtime-test/initramfs.cpio.zst \
            --images build/runtime-test/images --config artifact/report/config-final \
            --scenarios base --accel tcg --matrix tcg --repeat 2 --out build/runtime-test/run-tcg 2>&1 | tee runtime-tcg.log

      - name: Reports
        if: always()
        run: |
          for d in run-all run-matrix run-tcg; do
            if [ -f build/runtime-test/$d/summary.md ]; then
              { echo "## $d"; cat build/runtime-test/$d/summary.md; } | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
            fi
          done
          for d in build/runtime-test/run-all/*/ build/runtime-test/run-matrix/*/ build/runtime-test/run-tcg/*/; do
            [ -f "$d/serial.log" ] || continue
            echo "::group::serial.log $d"; cat "$d/serial.log"; echo "::endgroup::"
          done
          # known unresolved findings are never silent: one annotation per finding and run log
          for f in runtime-all.log runtime-matrix.log runtime-tcg.log; do
            grep -h 'OPEN FINDING' "$f" 2>/dev/null | while IFS= read -r l; do
              echo "::warning title=Open kernel finding (not a clean pass)::$f: ${l#  }"
            done
            grep -h '^RESULT:' "$f" 2>/dev/null | sed "s/^/$f -> /" | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          tail -n 60 runtime-all.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-runtime-test
          path: |
            build/runtime-test/run-all/summary.md
            build/runtime-test/run-all/results.json
            build/runtime-test/run-matrix/summary.md
            build/runtime-test/run-matrix/results.json
            build/runtime-test/run-all/*/serial.log
            build/runtime-test/run-all/*/qemu-command.txt
            build/runtime-test/run-all/*/qemu-stderr.log
            build/runtime-test/run-matrix/*/serial.log
            build/runtime-test/run-tcg/summary.md
            build/runtime-test/run-tcg/results.json
            build/runtime-test/run-tcg/*/serial.log
            build/runtime-test/initramfs.cpio.zst.manifest
            build/runtime-test/images/images.txt
            probe-map.md
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-runtime-initramfs
          path: |
            build/runtime-test/initramfs.cpio.zst
            build/runtime-test/initramfs.cpio.zst.manifest
          if-no-files-found: warn
          retention-days: 3

  arch-baseline:
    # OPTIONAL, NON-GATING comparison: the same runtime guest on Arch's linux-lts kernel. The Arch
    # kernel is a different version and configuration, built by Arch; this job only shows how
    # the Xlin Kernel's runtime behaviour differs and never fails the workflow.
    needs: [build, runtime-test]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    steps:
      - name: Install the Arch kernel, QEMU and OVMF
        run: |
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --noconfirm --noprogressbar --needed qemu-system-x86 edk2-ovmf linux-lts python git nodejs
          ls /usr/lib/modules/
          pacman -Q linux-lts qemu-system-x86 edk2-ovmf

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: xlin-runtime-initramfs
          path: rt

      - name: Boot the same runtime guest on Arch linux-lts
        run: |
          set -o pipefail
          rel=$(ls /usr/lib/modules | grep -- -lts | head -n1)
          echo "Arch kernel release: $rel"
          kimg=/usr/lib/modules/$rel/vmlinuz
          ls -l "$kimg"
          # the release is Arch's, not Xlin's: the guest only compares it with what we pass
          # the lock file is only read for the expected release; pass it explicitly instead
          python3 scripts/xlin-runtime-test --kernel "$kimg" --initramfs rt/initramfs.cpio.zst \
            --images /nonexistent --scenarios base,stress --repeat 3 --expect-release "$rel" \
            --out build/arch/run 2>&1 | tee arch.log || true

      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: xlin-kernel-build
          path: artifact
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Control, the XLIN kernel under this container's QEMU (to separate kernel from QEMU/host effects)
        if: always()
        run: |
          # Xlin's own runtime job uses the runner's QEMU (Ubuntu), this job uses Arch's newer QEMU. What
          # a guest sees of the host CPU (and so which mitigations and early-boot messages appear)
          # depends on the QEMU version as well as on the kernel. Booting the Xlin kernel here, with the
          # same QEMU and on the same job host as the Arch kernel above, makes the comparison fair.
          set -o pipefail
          python3 scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs rt/initramfs.cpio.zst \
            --images /nonexistent --config artifact/report/config-final --scenarios base --repeat 3 \
            --out build/arch/xlin-control 2>&1 | tee arch-control.log || true
          for d in build/arch/xlin-control/*/; do [ -f "$d/serial.log" ] && { echo "::group::control serial.log $d"; cat "$d/serial.log"; echo "::endgroup::"; }; done
          true

      - name: Arch baseline report
        if: always()
        run: |
          cat build/arch/run/summary.md 2>/dev/null || tail -n 40 arch.log
          cat build/arch/xlin-control/summary.md 2>/dev/null || true
          for d in build/arch/run/*/; do [ -f "$d/serial.log" ] && { echo "::group::serial.log $d"; cat "$d/serial.log"; echo "::endgroup::"; }; done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-arch-baseline
          path: |
            build/arch/run/summary.md
            build/arch/run/results.json
            build/arch/xlin-control/summary.md
            build/arch/xlin-control/results.json
          if-no-files-found: warn
          retention-days: 14

  arch-qemu8-control:
    # OPTIONAL, NON-GATING controlled comparison for the open W^X finding: the Arch linux-lts kernel and the
    # Xlin kernel booted ONE AFTER THE OTHER in the SAME job, on the same runner host, with the SAME
    # QEMU (the runner's apt QEMU, as in the runtime-test job), OVMF, machine, CPU, memory, boot
    # method, command line and initramfs. It only counts what the boot logs say; it never decides that
    # the finding is harmless.
    needs: [build, runtime-test]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.runtime-test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF and zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf zstd
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          {
            echo "### Controlled Arch vs Xlin comparison: host and tools"
            echo '```'
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 'model' /proc/cpuinfo | head -n1 || true
            nproc
            dpkg-query -W -f '${Package} ${Version}\n' qemu-system-x86 ovmf
            qemu-system-x86_64 --version | head -n1
            uname -r
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Get the Arch linux-lts kernel image (only the vmlinuz is extracted; nothing is committed)
        run: |
          set -eu
          mkdir -p archk
          docker run --rm -v "$PWD/archk:/out" archlinux:latest sh -c '
            pacman -Syu --noconfirm --noprogressbar >/dev/null &&
            pacman -S --noconfirm --noprogressbar --needed linux-lts >/dev/null &&
            rel=$(ls /usr/lib/modules | grep -- -lts | head -n1) &&
            cp /usr/lib/modules/$rel/vmlinuz /out/vmlinuz && echo "$rel" >/out/release &&
            pacman -Q linux-lts >/out/package'
          ls -l archk; cat archk/release archk/package

      - uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: xlin-runtime-initramfs
          path: rt

      - name: Boot both kernels, same QEMU, same host, same job
        run: |
          set -o pipefail
          rel=$(cat archk/release)
          # Arch first, then Xlin, then Arch and Xlin again, so host drift within the job is visible
          for round in 1 2; do
            python3 scripts/xlin-runtime-test --kernel archk/vmlinuz --initramfs rt/initramfs.cpio.zst \
              --images /nonexistent --scenarios base --repeat 10 --expect-release "$rel" \
              --out build/qemu8/arch-$round 2>&1 | tee -a control-arch.log || true
            python3 scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs rt/initramfs.cpio.zst \
              --images /nonexistent --config artifact/report/config-final --scenarios base --repeat 10 \
              --out build/qemu8/xlin-$round 2>&1 | tee -a control-xlin.log || true
          done

      - name: Count what the boot logs say (ITS, CPA W^X notice, DEBUG_WX)
        if: always()
        run: |
          {
            echo "### Arch linux-lts vs Xlin kernel, same job host and QEMU"
            echo
            python3 scripts/xlin-wx-compare arch=build/qemu8/arch-1 arch=build/qemu8/arch-2 xlin=build/qemu8/xlin-1 xlin=build/qemu8/xlin-2
            echo
            echo "Arch package: $(cat archk/package 2>/dev/null)"
            echo "This counts log lines. It does not show that the CPA notice is harmless."
          } | tee wx-compare.md | tee -a "$GITHUB_STEP_SUMMARY"
          grep -h '^RESULT:' control-arch.log control-xlin.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-arch-qemu8-control
          path: |
            wx-compare.md
            archk/release
            archk/package
            build/qemu8/*/summary.md
            build/qemu8/*/results.json
            build/qemu8/*/*/serial.log
            build/qemu8/*/*/qemu-command.txt
          if-no-files-found: warn
          retention-days: 14

  runtime-compare:
    # Informational side-by-side of the Xlin Kernel and the Arch baseline. Never gates.
    needs: [runtime-test, arch-baseline]
    if: always() && needs.runtime-test.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xlin-runtime-test
          path: xlin
      - uses: actions/download-artifact@v4
        with:
          name: xlin-arch-baseline
          path: arch
      - name: Compare (informational)
        run: |
          set -eu
          x=$(find xlin -name results.json -path '*run-all*' | head -n1)
          a=$(find arch -name results.json | head -n1)
          python3 scripts/xlin-runtime-compare "$x" "Xlin Kernel" "$a" "Arch linux-lts" | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    # The release package for QEMU/OVMF development (XlinOS), assembled from THIS run's build and then
    # verified the way a user would use it: unpack it fresh, check SHA256SUMS, boot it with the
    # package's own xlin-run (minimal initramfs, and an ext4 root disk with root=/dev/vda).
    # Not signed: the maintainer signs SHA256SUMS with the production key.
    needs: [build, boot-test]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU, OVMF, BusyBox, e2fsprogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static zstd file e2fsprogs shellcheck
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Xlin Fetch and Xlin Verify (pinned source, needed for gen_init_cpio)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact
      - name: Build the minimal initramfs and the package
        run: |
          set -eu
          ./scripts/xlin-initramfs --out build/pkg/initramfs-minimal.cpio.zst
          ./scripts/xlin-package --report artifact/report --out build/pkg/dist --initramfs build/pkg/initramfs-minimal.cpio.zst
      - name: Verify the package as a user would (fresh unpack, checksums, boot, ext4 root)
        run: |
          set -eu
          mkdir -p build/pkg/unpacked
          zstd -dc build/pkg/dist/xlin-*.tar.zst | tar -C build/pkg/unpacked -xf -
          ( cd build/pkg/dist && sha256sum -c ./*.tar.zst.sha256 )
          p=$(echo build/pkg/unpacked/xlin-*)
          ( cd "$p" && sha256sum -c SHA256SUMS )
          test -x "$p/xlin-run"
          rel=$(sed -n 's/^xlin_kernel_release=//p' "$p/SOURCE-PIN.txt")
          echo "package kernel release: $rel"
          # 1. minimal initramfs through the package's own launcher, including module-signature enforcement on the command line
          { sleep 100; echo 'echo XLIN-PKG-UNAME "$(uname -r)"; cat /proc/cmdline; poweroff -f'; } |
            timeout 300 "$p/xlin-run" --package "$p" --smp 2 --memory 1024 2>&1 | tee build/pkg/boot-minimal.log || true
          grep -q 'XLIN-BOOT-TEST: SHELL-READY failed=0' build/pkg/boot-minimal.log
          grep -q "XLIN-PKG-UNAME $rel" build/pkg/boot-minimal.log
          grep -q 'module.sig_enforce=1' build/pkg/boot-minimal.log
          # 2. a real root filesystem on a virtio disk (the XlinOS workflow): BusyBox ext4 image, root=/dev/vda
          r=build/pkg/rootfs; mkdir -p $r/sbin $r/bin $r/proc $r/sys $r/dev $r/tmp
          cp "$(command -v busybox)" $r/bin/busybox
          for a in $(busybox --list); do ln -sf busybox $r/bin/$a; done
          cat >$r/sbin/init <<'INIT'
          #!/bin/busybox sh
          /bin/busybox mount -t proc proc /proc; /bin/busybox mount -t sysfs sys /sys; /bin/busybox mount -t devtmpfs dev /dev 2>/dev/null
          echo "XLIN-ROOTFS-OK release=$(uname -r) root=$(sed -n 's/.* root=\([^ ]*\).*/\1/p' /proc/cmdline) cpus=$(grep -c ^processor /proc/cpuinfo)"
          poweroff -f
          INIT
          chmod +x $r/sbin/init
          mke2fs -q -t ext4 -d $r build/pkg/root.img 128M
          timeout 300 "$p/xlin-run" --package "$p" --kernel "$p"/vmlinuz-xlin-"$rel" --no-initramfs --disk build/pkg/root.img --root /dev/vda --rootfstype ext4 --memory 1024 2>&1 | tee build/pkg/boot-rootfs.log || true
          grep -q "XLIN-ROOTFS-OK release=$rel root=/dev/vda" build/pkg/boot-rootfs.log
          { echo "### Release package verification"; echo "- fresh unpack, SHA256SUMS verified, package launcher boots the kernel (minimal initramfs) and an ext4 root disk"; echo '```'; cat "$p/SOURCE-PIN.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-release-candidate
          path: |
            build/pkg/dist/*.tar.zst
            build/pkg/dist/*.sha256
            build/pkg/boot-*.log
          retention-days: 30

  kselftest:
    # Upstream kselftests of the PINNED source, built out-of-tree (the source stays unmodified),
    # run in the Xlin Kernel under QEMU. Results are listed program by program. Programs that cannot
    # be built or are shell/python tests are listed as not run; nothing is hidden.
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and run dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev rsync pkg-config \
            libcap-dev libcap-ng-dev libnuma-dev libmount-dev libfuse-dev libpopt-dev libasound2-dev libmnl-dev \
            qemu-system-x86 ovmf busybox-static zstd cpio file shellcheck
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Xlin Fetch and Xlin Verify
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact
      - name: Build the selftests (out of tree) and the initramfs
        run: |
          set -eu
          shellcheck -x tests/kselftest/build.sh tests/kselftest/mk-initramfs.sh
          sh -n tests/kselftest/init
          tests/kselftest/build.sh "$PWD/upstream/src/linux" "$PWD/build/kselftest" $(cat tests/kselftest/targets.txt | grep -v '^#' | tr '\n' ' ')
          cat build/kselftest/not-built.txt
          ./scripts/xlin-verify --strict >/dev/null   # the pinned source must still be unmodified
          tests/kselftest/mk-initramfs.sh build/kselftest/initramfs.cpio.zst tests/kselftest/init build/kselftest/payload
      - name: Run the selftests in the Xlin Kernel
        run: |
          set -o pipefail
          mkdir -p build/kselftest/run
          # xlin-run needs a package layout; point it at the build's own files
          timeout 5400 ./scripts/xlin-run --kernel artifact/report/bzImage --initramfs build/kselftest/initramfs.cpio.zst \
            --no-enforce-modules --smp 4 --memory 2048 --append "loglevel=4" 2>&1 | tee build/kselftest/run/serial.log || true
          grep -a '^XLIN-KSELFTEST' build/kselftest/run/serial.log | tr -d '\r' >build/kselftest/run/results.txt || true
          grep -q 'XLIN-KSELFTEST: done' build/kselftest/run/results.txt
      - name: Result table
        if: always()
        run: |
          python3 tests/kselftest/report.py build/kselftest/run/results.txt build/kselftest/not-built.txt tests/kselftest/expected.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-kselftest
          path: |
            build/kselftest/run/
            build/kselftest/not-built.txt
            build/kselftest/logs/
          retention-days: 30

  perf:
    # Basic performance baseline: micro-benchmarks run in the same VM configuration, on the same host,
    # in the same job, for the Xlin Kernel and Arch linux-lts, interleaved three rounds. INFORMATIONAL: a
    # shared CI runner is noisy and no threshold is enforced. These are not claims that Xlin is faster or slower.
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential qemu-system-x86 ovmf busybox-static zstd cpio
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          {
            echo "### Performance baseline: host"; echo '```'; grep -m1 'model name' /proc/cpuinfo; nproc; ls -l /dev/kvm || echo "no /dev/kvm: TCG, numbers are meaningless for comparison"; qemu-system-x86_64 --version | head -n1; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Get the Arch linux-lts kernel image (only the vmlinuz is extracted; nothing is committed)
        run: |
          set -eu
          mkdir -p archk
          docker run --rm -v "$PWD/archk:/out" archlinux:latest sh -c '
            pacman -Syu --noconfirm --noprogressbar >/dev/null &&
            pacman -S --noconfirm --noprogressbar --needed linux-lts >/dev/null &&
            rel=$(ls /usr/lib/modules | grep -- -lts | head -n1) &&
            cp /usr/lib/modules/$rel/vmlinuz /out/vmlinuz && echo "$rel" >/out/release &&
            pacman -Q linux-lts >/out/package'
          cat archk/release archk/package
      - uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact
      - name: Build the benchmark and initramfs
        run: |
          set -eu
          mkdir -p build/perf/payload
          gcc -O2 -Wall -Wextra -static -o build/perf/payload/xlin-bench tests/perf/xlin-bench.c
          tests/kselftest/mk-initramfs.sh build/perf/initramfs.cpio.zst tests/perf/init build/perf/payload
      - name: Run (Xlin, Arch, Xlin, Arch, Xlin, Arch; identical VM, host and command line)
        run: |
          set -o pipefail
          mkdir -p build/perf/logs
          for round in 1 2 3; do
            for k in xlin arch; do
              img=artifact/report/bzImage; [ $k = arch ] && img=archk/vmlinuz
              timeout 300 ./scripts/xlin-run --kernel "$img" --initramfs build/perf/initramfs.cpio.zst --no-enforce-modules \
                --smp 2 --memory 1024 --append "loglevel=3 mitigations=auto" 2>&1 | tee build/perf/logs/$k-$round.log || true
            done
          done
      - name: Medians
        if: always()
        run: python3 tests/perf/summarize.py build/perf/logs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-perf
          path: build/perf/logs/
          retention-days: 30
