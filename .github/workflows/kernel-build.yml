#
# Builds the REAL pinned kernel with the approved Xlin x86_64 configuration and checks
# the artifacts. A build validation only: the kernel is NOT booted here, and the
# uploaded files are build artifacts, not a release.
name: Kernel build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev zstd kmod file time
          gcc --version | head -n1; make --version | head -n1; nproc; free -g | sed -n 2p; df -h . | tail -n1

      - name: Static checks (syntax and shellcheck)
        run: |
          set -eu
          files="scripts/xlin-build tests/build-negative.sh"
          for f in $files; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $files

      - name: Xlin Fetch and Xlin Verify (pinned source, strict)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Build script negative tests
        run: ./tests/build-negative.sh

      - name: Xlin Build (configure, compile, install modules, check artifacts)
        run: |
          set -o pipefail
          ./scripts/xlin-build --out "$PWD/build/xlin-x86_64" 2>&1 | tee build-run.log

      - name: Build report
        if: always()
        run: |
          if [ -f build/xlin-x86_64/report/build-report.md ]; then
            cat build/xlin-x86_64/report/build-report.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No build report was produced (the build failed before it)." | tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 60 build-run.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: The pinned source is still unmodified
        run: ./scripts/xlin-verify --strict >/dev/null

      - name: Upload the build artifacts (not a release; not boot-tested)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlin-kernel-build
          path: |
            build/xlin-x86_64/report/
            build/xlin-x86_64/logs/
          if-no-files-found: warn
          retention-days: 14

  boot-test:
    # Boots the kernel built by the "build" job in QEMU with OVMF (UEFI) and a minimal
    # initramfs. Direct kernel boot: this does NOT test Xlin Boot, and QEMU success says
    # nothing about physical hardware.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF and BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static zstd file
          qemu-system-x86_64 --version | head -n1
          dpkg-query -W -f '${Package} ${Version}\n' ovmf qemu-system-x86 busybox-static
          busybox 2>&1 | head -n1
          ls -l /dev/kvm || echo "no /dev/kvm: the test will use software emulation (TCG)"

      - name: Allow QEMU to use KVM when the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Static checks (syntax and shellcheck)
        run: |
          set -eu
          files="scripts/xlin-initramfs tests/boot-selftest.sh tests/boot-negative.sh"
          for f in $files; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $files
          python3 -m py_compile scripts/xlin-boot-test
          for f in tests/boot/init tests/boot/xlin-pass tests/boot/init-broken; do sh -n "$f"; done

      - name: Xlin Fetch and Xlin Verify (pinned source, needed for gen_init_cpio)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Download the kernel built by the build job
        uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact

      - name: The kernel under test is the one the build job reported
        run: |
          set -eu
          ls -l artifact/report/
          want=$(sed -n 's/^bzimage_sha256=//p' artifact/report/build-report.env)
          got=$(sha256sum artifact/report/bzImage | cut -d' ' -f1)
          echo "build report: $want"; echo "downloaded:   $got"
          [ -n "$want" ] && [ "$want" = "$got" ]
          grep '^kernel_release=' artifact/report/build-report.env

      - name: Boot-tool self-test (simulated guest, not a boot)
        run: ./tests/boot-selftest.sh

      - name: Build the minimal initramfs
        run: ./scripts/xlin-initramfs --out build/boot-test/initramfs.cpio.zst

      - name: Boot the Xlin Kernel in QEMU + OVMF
        run: |
          set -o pipefail
          ./scripts/xlin-boot-test --kernel artifact/report/bzImage --initramfs build/boot-test/initramfs.cpio.zst \
            --out build/boot-test/run --timeout 600 2>&1 | tee boot-run.log

      - name: Boot report
        if: always()
        run: |
          if [ -f build/boot-test/run/report.md ]; then
            cat build/boot-test/run/report.md | tee -a "$GITHUB_STEP_SUMMARY"
            echo '### Serial log (complete)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 400 build/boot-test/run/serial.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No boot report was produced." | tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 40 boot-run.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Complete serial log of the boot test
        if: always()
        run: |
          echo "::group::serial.log"
          cat build/boot-test/run/serial.log || true
          echo "::endgroup::"
          cat build/boot-test/initramfs.cpio.zst.manifest || true

      - name: Boot negative tests (real boots that must fail)
        run: ./tests/boot-negative.sh --kernel artifact/report/bzImage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-boot-test
          path: |
            build/boot-test/run/serial.log
            build/boot-test/run/report.md
            build/boot-test/run/result.env
            build/boot-test/run/qemu-command.txt
            build/boot-test/run/qemu-stderr.log
            build/boot-test/initramfs.cpio.zst.manifest
          if-no-files-found: warn
          retention-days: 14

  runtime-test:
    # Step 6: expanded runtime validation (boot matrix, /proc/config.gz identity, hardening and
    # systemd probes, devices, filesystems, modules with kmod, kernel-log scan, reliability,
    # informational measurements). QEMU + OVMF only: this does NOT test Xlin Boot, physical
    # hardware or production readiness.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Xlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install QEMU, OVMF, BusyBox, kmod and the image tools (from the distribution; nothing is committed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf busybox-static zstd file kmod \
            e2fsprogs dosfstools mtools squashfs-tools genisoimage btrfs-progs xfsprogs ntfs-3g
          {
            echo "### Tools used by the runtime test (installed on the runner, not committed)"
            echo '```'
            dpkg-query -W -f '${Package} ${Version}\n' qemu-system-x86 ovmf busybox-static kmod libkmod2 e2fsprogs dosfstools mtools squashfs-tools genisoimage btrfs-progs xfsprogs ntfs-3g
            echo '```'
            echo "kmod licence (from /usr/share/doc/kmod/copyright):"
            echo '```'
            grep -E '^(License|Files):' /usr/share/doc/kmod/copyright | head -n 12 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l /dev/kvm || echo "no /dev/kvm: runs will use software emulation (TCG)"

      - name: Allow QEMU to use KVM when the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Static checks (syntax, shellcheck, guest scripts)
        run: |
          set -eu
          host="scripts/xlin-test-images scripts/xlin-initramfs tests/runtime-selftest.sh"
          for f in $host; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x $host
          python3 -m py_compile scripts/xlin-runtime-test scripts/xlin-probe-map scripts/xlin-runtime-compare
          for f in tests/runtime/init tests/runtime/lib.sh tests/runtime/probes.sh tests/runtime/reboot-cycle tests/runtime/udhcpc.script tests/runtime/suites/*.sh; do sh -n "$f"; done

      - name: Xlin Fetch and Xlin Verify (pinned source, needed for gen_init_cpio and Kconfig)
        run: |
          ./scripts/xlin-fetch
          ./scripts/xlin-verify --strict

      - name: Download the kernel built by the build job
        uses: actions/download-artifact@v4
        with:
          name: xlin-kernel-build
          path: artifact

      - name: The kernel under test is the one the build job reported
        run: |
          set -eu
          want=$(sed -n 's/^bzimage_sha256=//p' artifact/report/build-report.env)
          got=$(sha256sum artifact/report/bzImage | cut -d' ' -f1)
          [ -n "$want" ] && [ "$want" = "$got" ]
          ls -l artifact/report/

      - name: Probe map (every probe against the build's real final .config)
        run: |
          set -o pipefail
          python3 scripts/xlin-probe-map --src upstream/src/linux --config artifact/report/config-final \
            --allow-unsupported --out probe-map.md | tee probe-map.txt
          { echo "### Probe-to-option map"; cat probe-map.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Runtime-tool self-test (simulated guest, not a boot)
        run: ./tests/runtime-selftest.sh

      - name: Build the runtime initramfs (with the runner's kmod) and the test disk images
        run: |
          set -eu
          ./scripts/xlin-initramfs --runtime --kmod /usr/bin/kmod --out build/runtime-test/initramfs.cpio.zst
          cat build/runtime-test/initramfs.cpio.zst.manifest
          ./scripts/xlin-test-images --out build/runtime-test/images --modules-tar artifact/report/modules-*.tar.zst

      - name: Runtime validation, all scenarios (one boot each)
        run: |
          set -o pipefail
          ./scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs build/runtime-test/initramfs.cpio.zst \
            --images build/runtime-test/images --config artifact/report/config-final \
            --scenarios all --repeat 1 --out build/runtime-test/run-all 2>&1 | tee runtime-all.log

      - name: Runtime validation, boot matrix (vCPUs x memory, 3 boots each, flake rate)
        run: |
          set -o pipefail
          ./scripts/xlin-runtime-test --kernel artifact/report/bzImage --initramfs build/runtime-test/initramfs.cpio.zst \
            --images build/runtime-test/images --config artifact/report/config-final \
            --scenarios base --matrix auto --repeat 3 --out build/runtime-test/run-matrix 2>&1 | tee runtime-matrix.log

      - name: Reports
        if: always()
        run: |
          for d in run-all run-matrix; do
            if [ -f build/runtime-test/$d/summary.md ]; then
              { echo "## $d"; cat build/runtime-test/$d/summary.md; } | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
            fi
          done
          for d in build/runtime-test/run-all/*/ build/runtime-test/run-matrix/*/; do
            [ -f "$d/serial.log" ] || continue
            echo "::group::serial.log $d"; cat "$d/serial.log"; echo "::endgroup::"
          done
          tail -n 60 runtime-all.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-runtime-test
          path: |
            build/runtime-test/run-all/summary.md
            build/runtime-test/run-all/results.json
            build/runtime-test/run-matrix/summary.md
            build/runtime-test/run-matrix/results.json
            build/runtime-test/run-all/*/serial.log
            build/runtime-test/run-all/*/qemu-command.txt
            build/runtime-test/run-all/*/qemu-stderr.log
            build/runtime-test/run-matrix/*/serial.log
            build/runtime-test/initramfs.cpio.zst.manifest
            build/runtime-test/images/images.txt
            probe-map.md
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-runtime-initramfs
          path: |
            build/runtime-test/initramfs.cpio.zst
            build/runtime-test/initramfs.cpio.zst.manifest
          if-no-files-found: warn
          retention-days: 3

  arch-baseline:
    # OPTIONAL, NON-GATING comparison: the same runtime guest on Arch's linux-lts kernel. The Arch
    # kernel is a different version and configuration, built by Arch; this job only shows how
    # the Xlin Kernel's runtime behaviour differs and never fails the workflow.
    needs: [build, runtime-test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    steps:
      - name: Install the Arch kernel, QEMU and OVMF
        run: |
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --noconfirm --noprogressbar --needed qemu-system-x86 edk2-ovmf linux-lts python git nodejs
          ls /usr/lib/modules/
          pacman -Q linux-lts qemu-system-x86 edk2-ovmf

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: xlin-runtime-initramfs
          path: rt

      - name: Boot the same runtime guest on Arch linux-lts
        run: |
          set -o pipefail
          rel=$(ls /usr/lib/modules | grep -- -lts | head -n1)
          echo "Arch kernel release: $rel"
          kimg=/usr/lib/modules/$rel/vmlinuz
          ls -l "$kimg"
          # the release is Arch's, not Xlin's: the guest only compares it with what we pass
          # the lock file is only read for the expected release; pass it explicitly instead
          python3 scripts/xlin-runtime-test --kernel "$kimg" --initramfs rt/initramfs.cpio.zst \
            --images /nonexistent --scenarios base,stress --repeat 3 --expect-release "$rel" \
            --out build/arch/run 2>&1 | tee arch.log || true

      - name: Arch baseline report
        if: always()
        run: |
          cat build/arch/run/summary.md 2>/dev/null || tail -n 40 arch.log
          for d in build/arch/run/*/; do [ -f "$d/serial.log" ] && { echo "::group::serial.log $d"; cat "$d/serial.log"; echo "::endgroup::"; }; done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xlin-arch-baseline
          path: |
            build/arch/run/summary.md
            build/arch/run/results.json
          if-no-files-found: warn
          retention-days: 14

  runtime-compare:
    # Informational side-by-side of the Xlin Kernel and the Arch baseline. Never gates.
    needs: [runtime-test, arch-baseline]
    if: always() && needs.runtime-test.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xlin-runtime-test
          path: xlin
      - uses: actions/download-artifact@v4
        with:
          name: xlin-arch-baseline
          path: arch
      - name: Compare (informational)
        run: |
          set -eu
          x=$(find xlin -name results.json -path '*run-all*' | head -n1)
          a=$(find arch -name results.json | head -n1)
          python3 scripts/xlin-runtime-compare "$x" "Xlin Kernel" "$a" "Arch linux-lts" | tee -a "$GITHUB_STEP_SUMMARY"
